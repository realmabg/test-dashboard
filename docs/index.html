<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny App</title>
    
    <meta name="ncaa-dashboard-build" content="6ff8cbc-rebased" />
    <script>
      (function() {
        var buildId = "6ff8cbc-rebased";
        var storageKey = "ncaa-dashboard-build-id";
        var priorBuild = null;
        try {
          priorBuild = localStorage.getItem(storageKey);
        } catch (err) {
          priorBuild = null;
        }
        var needsRefresh = priorBuild !== buildId;

        window.__DASHBOARD_BUILD_ID__ = buildId;

        var originalFetch = window.fetch ? window.fetch.bind(window) : null;
        if (originalFetch) {
          window.fetch = function(resource, init) {
            try {
              var request = resource;
              var url = null;
              if (typeof resource === "string") {
                url = new URL(resource, window.location.href);
              } else if (resource instanceof Request) {
                url = new URL(resource.url, window.location.href);
              }
              if (
                url &&
                (url.pathname.endsWith("/app.json") ||
                 url.pathname.endsWith("/shinylive-sw.js") ||
                 url.pathname.endsWith("/load-shinylive-sw.js"))
              ) {
                url.searchParams.set("v", buildId);
                request = resource instanceof Request ? new Request(url.toString(), resource) : url.toString();
              }
              return originalFetch(request, init);
            } catch (err) {
              return originalFetch(resource, init);
            }
          };
        }

        if (!needsRefresh) {
          return;
        }

        function done() {
          try {
            localStorage.setItem(storageKey, buildId);
          } catch (err) {}
          window.location.replace(window.location.pathname + "?v=" + encodeURIComponent(buildId));
        }

        var unregisterPromise = Promise.resolve();
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
          unregisterPromise = navigator.serviceWorker.getRegistrations()
            .then(function(registrations) {
              return Promise.all(registrations.map(function(reg) {
                return reg.unregister();
              }));
            })
            .catch(function() { return []; });
        }

        unregisterPromise
          .then(function() {
            if (!("caches" in window) || !window.caches.keys) {
              return [];
            }
            return window.caches.keys().then(function(keys) {
              return Promise.all(
                keys
                  .filter(function(key) {
                    return key.toLowerCase().indexOf("shinylive") >= 0;
                  })
                  .map(function(key) {
                    return window.caches.delete(key);
                  })
              );
            });
          })
          .catch(function() { return []; })
          .finally(done);
      })();
    </script>
<script
      src="./shinylive/load-shinylive-sw.js?v=6ff8cbc-rebased"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "python",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
